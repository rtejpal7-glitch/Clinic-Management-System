# ClinicFlow local stack: PostgreSQL 16 + API server + web client.
#   1. ./scripts/generate-env.sh        (creates .env with random secrets)
#   2. docker compose up --build
#   3. open http://localhost:8080       (Swagger UI: http://localhost:8080/swagger/ui)
#   4. optional demo data: python3 scripts/seed_demo.py --api http://localhost:8080/api/v1 --admin-pass "$BOOTSTRAP_ADMIN_PASSWORD"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run scripts/generate-env.sh}
      POSTGRES_DB: postgres
      CLINICFLOW_OWNER_PASSWORD: ${CLINICFLOW_OWNER_PASSWORD:?}
      CLINICFLOW_APP_PASSWORD: ${CLINICFLOW_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinicflow"]
      interval: 5s
      retries: 20
    # Not published to the host by default. Uncomment for local psql access:
    # ports: ["5432:5432"]

  backend:
    build: ./backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://clinicflow_app:${CLINICFLOW_APP_PASSWORD}@db:5432/clinicflow
      MIGRATION_DATABASE_URL: postgresql://clinicflow_owner:${CLINICFLOW_OWNER_PASSWORD}@db:5432/clinicflow
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?}
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?}
      ABDM_MODE: mock
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
