server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;

  # Security headers for the web app. TLS terminates at the load balancer /
  # reverse proxy in front of this container (see docs/SECURITY.md); enable HSTS there.
  # nginx drops server-level add_header lines in any location that sets its own
  # add_header, so the locations below that add Cache-Control repeat this set.
  # img-src allows blob: for clinical photos and handwritten pages, which the app
  # fetches with the user's token and shows through object URLs.
  set $csp "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Resolve the API container at request time (Docker's DNS), so nginx still starts
  # if the backend is not up yet and recovers when it is.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8000;

  location /api/ {
    # Clinical photos and handwritten pages are sent as JSON up to 9 MB; the backend
    # enforces the exact per-endpoint limits (1 MB for everything else).
    client_max_body_size 10m;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Handwriting recognition calls an external provider (HWR_TIMEOUT_SECONDS, default 30).
    proxy_read_timeout 90s;
  }
  # API documentation (consider restricting to internal networks in production)
  location ~ ^/(swagger|api-docs)/ {
    proxy_pass $backend_upstream;
  }

  location / {
    try_files $uri /index.html;
  }
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=3600";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }
  location = /index.html {
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
