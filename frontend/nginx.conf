server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;

  # Security headers for the web app. TLS terminates at the load balancer /
  # reverse proxy in front of this container (see docs/SECURITY.md); enable HSTS there.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Resolve the API container at request time (Docker's DNS), so nginx still starts
  # if the backend is not up yet and recovers when it is.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8000;

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  # API documentation (consider restricting to internal networks in production)
  location ~ ^/(swagger|api-docs)/ {
    proxy_pass $backend_upstream;
  }

  location / {
    try_files $uri /index.html;
  }
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=3600";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
